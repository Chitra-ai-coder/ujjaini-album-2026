<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finale</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #030305; /* Matches your cosmic theme */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            text-align: center;
            z-index: 10;
            opacity: 0;
            animation: slowFadeIn 3s ease forwards 1s; /* Waits 1 second, then slowly appears */
        }

        h1 {
            font-size: 18vw; /* Massive responsive text */
            font-weight: 700;
            margin: 0;
            line-height: 1;
            /* Beautiful flowing gradient */
            background: linear-gradient(90deg, #ffffff, #ffb3c6, #ff3366, #ffb3c6, #ffffff);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 5s linear infinite;
            text-shadow: 0 0 60px rgba(255, 51, 102, 0.3);
        }

        .name {
            font-size: 6vw;
            font-style: italic;
            color: #ffffff;
            margin-top: 10px;
            opacity: 0;
            animation: slowFadeIn 3s ease forwards 3s; /* Appears after the main text */
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            h1 { font-size: 26vw; }
            .name { font-size: 10vw; }
        }

        @keyframes slowFadeIn {
            to { opacity: 1; transform: translateY(0); }
            from { opacity: 0; transform: translateY(20px); }
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <h1>I LOVE U</h1>
        <div class="name">Ujjaini ❤️</div>
    </div>

    <script>
        // Floating cinematic dust/particles
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.radius = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5 - 0.2; // Slowly floats upwards
                this.alpha = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                // Wrap around edges seamlessly
                if (this.y < -10) this.y = height + 10;
                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 51, 102, ${this.alpha})`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff3366';
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { 
                p.update(); 
                p.draw(); 
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
