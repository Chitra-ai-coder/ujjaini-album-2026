<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Beating Heart</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030305;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #heartCanvas.active {
            opacity: 1;
        }

        /* Glassmorphism Container styling */
        .card, .modal {
            position: relative;
            z-index: 10;
            background: linear-gradient(135deg, rgba(25, 25, 30, 0.4) 0%, rgba(10, 10, 15, 0.6) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(255, 51, 102, 0.05);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Initial Start Card */
        .card {
            width: 90%;
            max-width: 360px;
            padding: 40px 30px;
            text-align: center;
        }

        .card.hidden {
            opacity: 0;
            transform: scale(0.9) translateY(-20px);
            pointer-events: none;
        }

        .heart-icon { font-size: 42px; margin-bottom: 12px; animation: pulse 1.2s infinite ease-in-out; display: inline-block; }
        .title { font-size: 1.4rem; font-weight: 700; color: #ffffff; margin-bottom: 16px; letter-spacing: -0.5px; }
        .status-text { font-size: 0.82rem; color: #a0a5b5; margin-bottom: 15px; }
        .progress-bar { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; margin-bottom: 30px; }
        .progress-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff3366, #ff6b8b); border-radius: 2px; animation: loading 2s infinite ease-in-out; }

        .run-btn {
            width: 100%;
            background: rgba(255, 51, 102, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 51, 102, 0.3);
            padding: 14px 0;
            border-radius: 50px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .run-btn:hover, .run-btn:active {
            background: rgba(255, 51, 102, 0.25);
            border-color: #ff3366;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
            transform: scale(1.02);
        }

        /* Center Heart Caption */
        .heart-caption {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-style: italic;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 0 12px rgba(255, 51, 102, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 0.5px;
            text-align: center;
            width: 100%;
        }

        .heart-caption.visible {
            opacity: 1;
        }

        /* Caption dynamic shifts for mobile & desktop */
        .heart-caption.shifted { transform: translateX(-50%) translateY(-14vh); }
        @media (min-width: 768px) {
            .heart-caption.shifted { transform: translateX(calc(-50% - 18vw)) translateY(0); }
        }

        /* Final Message Modal */
        .modal {
            position: absolute;
            width: 90%;
            max-width: 400px;
            padding: 35px 30px;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        /* Dynamic Split-Screen active states */
        .modal.active {
            opacity: 1;
            transform: scale(1) translateY(14vh); /* Shifts down on mobile */
            pointer-events: auto;
        }

        @media (min-width: 768px) {
            .modal.active {
                transform: scale(1) translateX(18vw); /* Shifts right on desktop */
            }
        }

        .modal-top { display: flex; justify-content: center; margin-bottom: 25px; }
        .modal-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #ff3366; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }
        .modal-content { font-family: 'Playfair Display', serif; font-size: 1.05rem; line-height: 1.8; color: #e5e7eb; min-height: 220px; }
        .typing-cursor::after { content: '|'; animation: blink 1s step-start infinite; color: #ff3366; }
        .modal-footer { margin-top: 24px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); font-family: 'Playfair Display', serif; font-size: 0.9rem; color: #9ca3af; text-align: right; font-style: italic; opacity: 0; transition: opacity 1s ease; }
        .modal-footer.visible { opacity: 1; }

        .next-chapter-btn {
            width: 100%; margin-top: 25px; padding: 14px 0; border-radius: 50px;
            background: rgba(255, 51, 102, 0.1); color: #ffffff; border: 1px solid rgba(255, 51, 102, 0.4);
            font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 600;
            letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
            opacity: 0; pointer-events: none; transition: all 0.5s ease;
        }

        .next-chapter-btn.visible { opacity: 1; pointer-events: auto; }
        .next-chapter-btn:hover, .next-chapter-btn:active { background: #ff3366; box-shadow: 0 10px 25px rgba(255, 51, 102, 0.4); transform: scale(1.02); }

        /* Mobile Font Adjustments */
        @media (max-width: 480px) {
            .modal-content { font-size: 0.95rem; line-height: 1.6; }
            .heart-caption { font-size: 1.1rem; bottom: 10%; }
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
        @keyframes loading { 0% { transform: translateX(-100%); } 50% { transform: translateX(0%); } 100% { transform: translateX(100%); } }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <!-- Center Card -->
    <div class="card" id="startCard">
        <div class="heart-icon">❤️</div>
        <div class="title">heartbeat.js</div>
        <div class="status-text">Generating love particles ...</div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <button class="run-btn" id="runBtn">INITIALIZE CORE</button>
    </div>

    <!-- 3D Heart -->
    <canvas id="heartCanvas"></canvas>

    <div class="heart-caption" id="heartCaption">
        I CODED THIS HEARTBEAT<br>for you Ujjaini 💗
    </div>

    <!-- Message Modal -->
    <div class="modal" id="messageModal">
        <div class="modal-top">
            <span class="modal-tag">SYSTEM MESSAGE</span>
        </div>
        <div class="modal-content typing-cursor" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter">
            – coded with love by Chitrabhanu Hazra
        </div>
        <button class="next-chapter-btn" id="nextChapterBtn">Next Chapter &rarr;</button>
    </div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const startCard = document.getElementById('startCard');
        const runBtn = document.getElementById('runBtn');
        const heartCaption = document.getElementById('heartCaption');
        const messageModal = document.getElementById('messageModal');
        const modalBody = document.getElementById('modalBody');
        const modalFooter = document.getElementById('modalFooter');
        const nextChapterBtn = document.getElementById('nextChapterBtn');

        let width, height, cx, cy;
        let particles = [];
        let animationId;
        let time = 0;
        let isRunning = false;
        let isTyping = false;

        // Shift Variables for Cinematic Transition
        let currentShiftX = 0;
        let currentShiftY = 0;
        let targetShiftX = 0;
        let targetShiftY = 0;

        const words = [
            "i love you", "forever", "je t'aime", "sweetheart", 
            "te amo", "always", "me & you", "love", "ujjaini"
        ];

        const finalMessage = "Dear Ujjaini,\n\nI coded this heartbeat for you...\n\nEvery line of code, every pixel, and every beat is a reminder of how much you mean to me.\n\nNo matter where life takes us, my heart will always run in an infinite loop for you, beating forever. ❤️";

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            cx = width / 2;
            cy = height / 2 - 30;

            // Recalculate shift dynamically if the user rotates their phone or resizes window
            if (messageModal.classList.contains('active')) {
                if (width > 768) {
                    targetShiftX = width * 0.18; // Shift left on desktop
                    targetShiftY = 0;
                } else {
                    targetShiftX = 0;
                    targetShiftY = height * 0.14; // Shift up on mobile
                }
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function getHeartPoint(t, layer) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            const z = layer * 6; 
            return { x, y, z };
        }

        class Particle {
            constructor() {
                this.t = Math.random() * Math.PI * 2;
                this.layer = (Math.random() * 2) - 1; 
                
                const target = getHeartPoint(this.t, this.layer);
                this.targetX = target.x;
                this.targetY = target.y;
                this.targetZ = target.z;

                this.startX = (Math.random() - 0.5) * 500; 
                this.startY = -200 - Math.random() * 200; 
                this.startZ = (Math.random() - 0.5) * 200; 

                this.word = words[Math.floor(Math.random() * words.length)];
                this.fontSize = Math.floor(Math.random() * 8) + 10; 

                const hues = [340, 350, 355, 330];
                const hue = hues[Math.floor(Math.random() * hues.length)];
                const lightness = Math.floor(Math.random() * 30) + 55;
                this.color = `hsl(${hue}, 100%, ${lightness}%)`;

                this.progress = 0;
                this.delay = Math.random() * 60; 
                this.speed = Math.random() * 0.015 + 0.01; 
            }

            update(globalTime) {
                if (this.delay > 0) {
                    this.delay--;
                    this.currX = 0; this.currY = -9999; this.currZ = 0;
                    return;
                } else if (this.progress < 1) {
                    this.progress += this.speed;
                    if (this.progress > 1) this.progress = 1;
                }

                const ease = 1 - Math.pow(1 - this.progress, 3);
                const x = this.startX + (this.targetX - this.startX) * ease;
                const y = this.startY + (this.targetY - this.startY) * ease;
                const z = this.startZ + (this.targetZ - this.startZ) * ease;
                const angle = globalTime * 0.4;

                this.currX = x * Math.cos(angle) - z * Math.sin(angle);
                this.currZ = z * Math.cos(angle) + x * Math.sin(angle);
                this.currY = y; 
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < 250; i++) {
                particles.push(new Particle());
            }
        }

        function render() {
            if (!isRunning) return;
            ctx.clearRect(0, 0, width, height);
            
            time += 0.015;

            // Smoothly interpolate the 3D canvas center shift
            currentShiftX += (targetShiftX - currentShiftX) * 0.03;
            currentShiftY += (targetShiftY - currentShiftY) * 0.03;

            const pulse = Math.abs(Math.sin(time * 2.2));
            const beat = 1 + Math.pow(pulse, 30) * 0.12; 
            const scale = (Math.min(width, height) / 45) * beat;

            particles.forEach(p => p.update(time));
            particles.sort((a, b) => a.currZ - b.currZ);
            ctx.textAlign = 'center';

            particles.forEach(p => {
                if (p.currY === -9999) return; 

                const perspective = 200;
                const zFactor = perspective / (perspective - p.currZ); 

                // Apply the cinematic shift logic to the render position
                const drawX = (cx - currentShiftX) + p.currX * scale * zFactor;
                const drawY = (cy - currentShiftY) + p.currY * scale * zFactor;
                
                const drawSize = Math.floor(p.fontSize * zFactor); 
                const opacity = Math.min(1, Math.max(0.1, (p.currZ + 15) / 30));

                ctx.globalAlpha = opacity;
                ctx.font = `${drawSize}px 'JetBrains Mono', monospace`; 
                ctx.fillStyle = p.color;
                
                ctx.fillText(p.word, drawX, drawY);
            });
            
            ctx.globalAlpha = 1.0; 
            animationId = requestAnimationFrame(render);
        }

        function startTypingEffect() {
            if (isTyping) return;
            isTyping = true;
            
            modalBody.innerHTML = '';
            let i = 0;
            
            function typeChar() {
                if (i < finalMessage.length) {
                    if (finalMessage.charAt(i) === '\n') {
                        modalBody.innerHTML += '<br>';
                    } else {
                        modalBody.innerHTML += finalMessage.charAt(i);
                    }
                    i++;
                    setTimeout(typeChar, 40); 
                } else {
                    modalBody.classList.remove('typing-cursor');
                    modalFooter.classList.add('visible');
                    
                    setTimeout(() => {
                        nextChapterBtn.classList.add('visible');
                    }, 800);
                }
            }
            typeChar();
        }

        runBtn.addEventListener('click', () => {
            runBtn.innerText = "PROCESSING...";
            runBtn.style.background = "#ff3366";
            runBtn.style.color = "#ffffff";
            
            setTimeout(() => {
                startCard.classList.add('hidden');
                canvas.classList.add('active');

                setTimeout(() => {
                    isRunning = true;
                    initParticles(); 
                    render();

                    // Show Caption
                    setTimeout(() => {
                        heartCaption.classList.add('visible');
                    }, 4000); 

                    // Trigger the Split-Screen Effect & Typewriter
                    setTimeout(() => {
                        // Apply target shift based on screen size
                        if (width > 768) {
                            targetShiftX = width * 0.18; // Moves heart left
                        } else {
                            targetShiftY = height * 0.14; // Moves heart up on mobile
                        }
                        
                        heartCaption.classList.add('shifted');
                        messageModal.classList.add('active');
                        
                        // Wait for transition to finish before typing
                        setTimeout(startTypingEffect, 1200);
                    }, 6500); 
                }, 500);
            }, 600);
        });

        nextChapterBtn.addEventListener('click', () => {
            window.parent.postMessage('nextPage', '*');
        });
    </script>
</body>
</html>
