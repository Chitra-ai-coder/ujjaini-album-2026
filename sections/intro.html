<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Intro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&display=swap');

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            background: linear-gradient(45deg, #020204, #0a0510, #0d0514, #020204);
            background-size: 400% 400%;
            animation: cosmicGradient 15s ease infinite;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        #spaceCanvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 1; 
            opacity: 0.85; 
        }

        .glass-card {
            position: relative;
            z-index: 10;
            background: linear-gradient(135deg, rgba(25, 25, 30, 0.4) 0%, rgba(10, 10, 15, 0.6) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 35px; 
            
            /* FIX 1: Card now starts small and hugs the text, growing as it types */
            width: max-content; 
            max-width: 90%; /* Prevents it from breaking mobile screens */
            min-width: 60px; /* Small enough for just the cursor */
            
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(255, 51, 102, 0.05);
            transform: translateY(20px);
            opacity: 0;
            animation: floatUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s;
            transition: all 0.1s ease-out; /* Smooths the step-by-step expansion */
        }

        .glow-orb {
            position: absolute; 
            width: 40vw; 
            height: 40vw;
            max-width: 400px;
            max-height: 400px;
            background: radial-gradient(circle, rgba(255, 51, 102, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 5; 
            border-radius: 50%; 
            pointer-events: none;
            animation: pulseGlow 6s infinite alternate ease-in-out;
        }

        h1 {
            font-size: 2.2rem; 
            font-style: italic; 
            font-weight: 400; 
            line-height: 1.4;
            margin-bottom: 0px; 
            display: inline-block;
            white-space: pre-wrap; /* Allows text to wrap gently on phones */
            background: linear-gradient(90deg, #ffffff, #ffb3c6);
            background-clip: text;
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            transition: margin-bottom 0.5s ease;
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.8rem; 
            color: #ff3366;
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin-top: 15px;
            margin-bottom: 45px; 
            opacity: 0; 
            display: none; 
            animation: fadeInSubtitle 1.2s ease forwards;
        }

        .enter-btn {
            background: rgba(255, 51, 102, 0.1); 
            color: #ffffff;
            border: 1px solid rgba(255, 51, 102, 0.4); 
            padding: 16px 0;
            width: 100%; 
            min-width: 250px; /* Keeps the button shape consistent */
            max-width: 280px;
            
            /* FIX 2: Perfect pill shape completely eliminates the jagged corner glitch */
            border-radius: 50px; 
            
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem; 
            font-weight: 500; 
            letter-spacing: 2px;
            text-transform: uppercase; 
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0; 
            display: none; 
            animation: fadeInBtn 1.2s ease forwards 0.5s;
        }

        .enter-btn:hover, .enter-btn:active {
            background: rgba(255, 51, 102, 0.25); 
            border-color: #ff3366;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.5); 
            transform: scale(1.04);
        }

        .cursor::after {
            content: '|'; 
            animation: blink 1s step-start infinite;
            color: #ff3366; 
            -webkit-text-fill-color: #ff3366;
        }

        /* --- MOBILE OPTIMIZATIONS --- */
        @media (max-width: 480px) {
            .glass-card { padding: 35px 25px; }
            h1 { font-size: 1.8rem; line-height: 1.5; }
            .subtitle { font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 35px; margin-top: 10px; }
            .enter-btn { padding: 14px 0; font-size: 0.85rem; }
        }

        /* Animations */
        @keyframes cosmicGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes floatUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInSubtitle { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInBtn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 
            0% { transform: scale(0.85); opacity: 0.5; } 
            100% { transform: scale(1.15); opacity: 0.9; } 
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <canvas id="spaceCanvas"></canvas>
    <div class="glow-orb"></div>

    <div class="glass-card" id="mainCard">
        <h1 id="typewriter" class="cursor"></h1>
        <div class="subtitle" id="subtitle">System Environment Ready</div>
        <button class="enter-btn" id="startBtn">Initialize</button>
    </div>

    <script>
        // --- 1. Dynamic Typewriter ---
        const textToType = "A universe written for you, Ujjaini.";
        const typewriterElement = document.getElementById('typewriter');
        const subtitle = document.getElementById('subtitle');
        const startBtn = document.getElementById('startBtn');
        let typeIndex = 0;

        function typeText() {
            if (typeIndex < textToType.length) {
                typewriterElement.textContent += textToType.charAt(typeIndex);
                typeIndex++;
                setTimeout(typeText, 70); 
            } else {
                setTimeout(() => { 
                    typewriterElement.classList.remove('cursor'); 
                    typewriterElement.style.marginBottom = "8px";
                    subtitle.style.display = "block";
                    startBtn.style.display = "block";
                }, 800);
            }
        }
        setTimeout(typeText, 1200);

        // --- 2. Navigation Trigger ---
        startBtn.addEventListener('click', () => {
            startBtn.style.background = '#ff3366';
            startBtn.style.color = '#ffffff';
            startBtn.style.boxShadow = '0 0 40px rgba(255, 51, 102, 0.9)';
            startBtn.innerText = "ACCESS GRANTED";
            
            setTimeout(() => {
                window.parent.postMessage('nextPage', '*');
            }, 600);
        });

        // --- 3. Dynamic Background Canvas (Constellations + Shooting Stars) ---
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [], shootingStars = [];

        function resizeCanvas() { 
            width = window.innerWidth; 
            height = window.innerHeight; 
            canvas.width = width; 
            canvas.height = height; 
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('touchmove', (e) => { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }); 

        class Star {
            constructor() {
                this.x = Math.random() * width; 
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4; 
                this.speedY = (Math.random() - 0.5) * 0.4;
            }
            update() {
                this.x += this.speedX; 
                this.y += this.speedY;
                if (this.x < 0 || this.x > width) this.speedX *= -1;
                if (this.y < 0 || this.y > height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fill();
            }
        }

        class ShootingStar {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height * 0.5; 
                this.length = Math.random() * 80 + 30;
                this.speed = Math.random() * 15 + 10;
                this.angle = (Math.PI / 4) + (Math.random() * 0.2); 
                this.opacity = 1;
            }
            update() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.opacity -= 0.015; 
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - Math.cos(this.angle) * this.length, this.y - Math.sin(this.angle) * this.length);
                ctx.lineWidth = 1.5;
                let gradient = ctx.createLinearGradient(this.x, this.y, this.x - Math.cos(this.angle) * this.length, this.y - Math.sin(this.angle) * this.length);
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                gradient.addColorStop(1, `rgba(255, 51, 102, 0)`);
                ctx.strokeStyle = gradient;
                ctx.stroke();
            }
        }

        function initStars() {
            stars = [];
            const numStars = Math.floor((width * height) / 9000);
            for (let i = 0; i < numStars; i++) stars.push(new Star());
        }
        initStars();

        function animateStars() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < stars.length; i++) {
                stars[i].update(); 
                stars[i].draw();
                for (let j = i; j < stars.length; j++) {
                    const dx = stars[i].x - stars[j].x, dy = stars[i].y - stars[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 110) {
                        ctx.beginPath(); 
                        ctx.strokeStyle = `rgba(255, 51, 102, ${1 - distance / 110})`;
                        ctx.lineWidth = 0.5; 
                        ctx.moveTo(stars[i].x, stars[i].y); 
                        ctx.lineTo(stars[j].x, stars[j].y); 
                        ctx.stroke();
                    }
                }
            }

            if (Math.random() < 0.02) {
                shootingStars.push(new ShootingStar());
            }

            for (let i = shootingStars.length - 1; i >= 0; i--) {
                shootingStars[i].update();
                shootingStars[i].draw();
                if (shootingStars[i].opacity <= 0) {
                    shootingStars.splice(i, 1); 
                }
            }

            requestAnimationFrame(animateStars);
        }
        animateStars();
    </script>
</body>
</html>
